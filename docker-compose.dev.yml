services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_PATH: /app/data/stripe.db
      EXPORT_DIR: /app/data/exports
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - app-data:/app/data
    command: sh -c "pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    stdin_open: true
    tty: true

volumes:
  app_node_modules:
  app_next:
  app-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: /app/data/stripe.db
      EXPORT_DIR: /app/data/exports
    volumes:
      - app-data:/app/data
    networks:
      - dokploy-network

volumes:
  app-data:

networks:
  dokploy-network:
    external: true
